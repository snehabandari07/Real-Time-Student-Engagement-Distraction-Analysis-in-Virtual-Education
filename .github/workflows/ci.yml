name: CI — Lint & Import Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,venv38,venv_opt,.git
          # Check style issues (max line length 120)
          flake8 . --count --max-line-length=120 --statistics --exclude=venv,venv38,venv_opt,.git --exit-zero

      - name: Check imports resolve correctly
        run: |
          python -c "import fastapi, uvicorn, jinja2, sqlalchemy, aiofiles, websockets"
          echo "All imports OK"
